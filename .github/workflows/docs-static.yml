name: Documentation Static Site

on:
  push:
    branches:
      - workflow-documentation-build
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build static documentation
        run: npm run build

      - name: Smoke test documentation
        run: npm test

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasetemco-docs-site
          path: dist-docs/

      - name: Validate Namecheap FTP secrets
        env:
          NAMECHEAP_FTP_SERVER: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          NAMECHEAP_FTP_USERNAME: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          NAMECHEAP_FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          NAMECHEAP_FTP_SERVER_DIR: ${{ secrets.NAMECHEAP_FTP_SERVER_DIR }}
        run: |
          missing=0
          if [ -z "$NAMECHEAP_FTP_SERVER" ]; then echo "Missing NAMECHEAP_FTP_SERVER"; missing=1; fi
          if [ -z "$NAMECHEAP_FTP_USERNAME" ]; then echo "Missing NAMECHEAP_FTP_USERNAME"; missing=1; fi
          if [ -z "$NAMECHEAP_FTP_PASSWORD" ]; then echo "Missing NAMECHEAP_FTP_PASSWORD"; missing=1; fi
          if [ -z "$NAMECHEAP_FTP_SERVER_DIR" ]; then echo "Missing NAMECHEAP_FTP_SERVER_DIR"; missing=1; fi
          exit "$missing"

      - name: Deploy to Namecheap by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          local-dir: ./dist-docs/
          server-dir: ${{ secrets.NAMECHEAP_FTP_SERVER_DIR }}
